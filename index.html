<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSole – AI-Powered E-Commerce Platform for Online Footwear Shopping</title>
    <meta
      name="description"
      content="SmartSole is an AI-powered online footwear shopping platform with AI Chatbot assistant, multi-angle zoom galleries, secure checkout, order and payment history, and admin order management."
    />
    <link rel="canonical" href="https://smartsole.store" />

    <!-- OpenGraph Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SmartSole – AI-Powered Online Footwear Shopping & Stylist" />
    <meta
      property="og:description"
      content="Shop authentic sneakers, running shoes, and formal footwear with our SmartSole AI shopping chatbot, high-res zoom galleries, secure payment gateway, and live order tracking."
    />
    <meta property="og:site_name" content="SmartSole" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1200&auto=format&fit=crop&q=80" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartSole – AI-Powered Footwear Shopping Platform" />
    <meta
      name="twitter:description"
      content="Interactive AI footwear chatbot, multi-angle zoom galleries, secure UPI/Card checkout, live shipment tracking, and admin dashboard."
    />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1200&auto=format&fit=crop&q=80" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "https://smartsole.store/#webapp",
          "name": "SmartSole AI Footwear Platform",
          "applicationCategory": "ShoppingApplication",
          "operatingSystem": "All",
          "description": "SmartSole - An AI-Powered E-Commerce Platform for Online Footwear Shopping with AI Chatbot, live order and payment history tracking, and admin order management.",
          "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "INR",
            "lowPrice": "999",
            "highPrice": "19999"
          }
        },
        {
          "@type": "OnlineStore",
          "@id": "https://smartsole.store/#store",
          "name": "SmartSole",
          "url": "https://smartsole.store",
          "logo": "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200&auto=format&fit=crop&q=80",
          "currenciesAccepted": "INR",
          "paymentAccepted": "Credit Card, Debit Card, UPI, Net Banking, Cash on Delivery",
          "priceRange": "₹999 - ₹19,999"
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#f1f2f4] text-slate-900 antialiased font-sans selection:bg-[#2874f0] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
